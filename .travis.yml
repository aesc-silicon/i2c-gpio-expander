language: generic

os: linux
dist: noble

# Only run on pull requests to main branch
branches:
  only:
    - main

# Set timeout to 90 minutes
timeout: 5400

# Conditional logic for PRs vs Cron
if: type IN (pull_request, cron)

cache:
  directories:
    - $HOME/.podman-cache

install:
  # Install Podman
  - sudo apt-get update
  - sudo apt-get install -y podman uidmap slirp4netns

  # Disable color
  - git config --global color.ui false

  # Install other dependencies
  - sudo snap install task --classic
  - sudo apt-get update
  - sudo apt-get install -y virtualenv

script:
  # Use appropriate branch: PR branch for PRs, main for cron
  - |
    if [ "$TRAVIS_EVENT_TYPE" = "cron" ]; then
      BRANCH="main"
      MANIFEST_SUFFIX="manifest_suffix=-nightly"
    else
      BRANCH="${TRAVIS_PULL_REQUEST_BRANCH:-main}"
      MANIFEST_SUFFIX=""
    fi

  # Prepare the project
  - CI=true IS_HEADLESS=true task install branch=${BRANCH} ${MANIFEST_SUFFIX}

  # Prepare files
  - CI=true IS_HEADLESS=true task asic:prepare

  # Run test: write
  - CI=true IS_HEADLESS=true task sim:simulate test_case=write

  # Run test: read
  - CI=true IS_HEADLESS=true task sim:simulate test_case=read

  # Prepare FPGA files
  - CI=true IS_HEADLESS=true task fpga:prepare

  # Synthesize FPGA design
  - CI=true IS_HEADLESS=true task fpga:synthesize

  # Generate layout
  - CI=true IS_HEADLESS=true task asic:build

  # Add metal fill
  - CI=true IS_HEADLESS=true task asic:fill

  # Run maximal DRC
  - CI=true IS_HEADLESS=true task asic:drc

notifications:
  email:
    on_success: never
    on_failure: always
    recipients:
      - nightly.reports@aesc-silicon.de
